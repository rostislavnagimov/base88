[package]
name = "base88"
version = "0.0.1"
edition = "2024"
description = "Fast and safe Base88 encoding/decoding"
license = "MIT"
repository = "https://github.com/rostislavnagimov/base88"
keywords = ["base64", "encoding", "binary", "codec", "serialization"]
categories = ["encoding", "parsing", "algorithms"]
include = ["src/**/*.rs", "Cargo.toml", "README.md"]

[dependencies]

[dev-dependencies]
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

[[bench]]
name = "bench"
path = "benches/performance.rs"
harness = false
